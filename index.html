<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project grid</title>
  <style>
    /* 
    
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
   
    */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 0;
    }
    .container {
      background-color: #000;
      display: grid;
      height: 748px;
      width: 748px;
      grid-template-columns:320px 198px 153px 50px;
      grid-template-rows:414px 130px 155px 22px;
      gap:9px;
    }
    .item{
      background-color:#F0F1EC ;
    }
    #a1{
      background-color:#E72F24 ;
    }
    #a2{
      grid-column: span 3; 
    }
    #a3{
      grid-row: span 2;
    }
    #a4{
      grid-column: span 2;
      grid-row: span 2;
    }
    #a5{
      background-color:#004592 ;
      border-bottom: 10px solid #000;
    }
    #a6{
      grid-row: span 2;
    }
    #a8{
      background-color: #F9D01E;
    }
    #a9{
      background-color: #232629;
    }
  </style>
</head>

<body>
   
   <div class="container">
    <div class="item" id="a1"></div>
    <div class="item" id="a2"></div>
    <div class="item" id="a3"></div>
    <div class="item" id="a4"></div>
    <div class="item" id="a5"></div>
    <div class="item" id="a6"></div>
    <div class="item" id="a7"></div>
    <div class="item" id="a8"></div>
    <div class="item" id="a9"></div>
   </div>
  
</body>

</html>
